plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yash.standbytv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yash.standbytv'
        minSdk 26          // Android TV 8.0 Oreo and newer
        targetSdk 34
        versionCode 3
        versionName '1.2'

        // Google Photos sign-in. Put your own OAuth client (type "TVs and Limited Input devices")
        // in local.properties:  google.clientId=...  and  google.clientSecret=...
        def lp = new Properties()
        def lpf = rootProject.file('local.properties')
        if (lpf.exists()) lpf.withInputStream { lp.load(it) }
        buildConfigField 'String', 'GOOGLE_CLIENT_ID', "\"${lp.getProperty('google.clientId', '')}\""
        buildConfigField 'String', 'GOOGLE_CLIENT_SECRET', "\"${lp.getProperty('google.clientSecret', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the APK installs straight away.
            // Swap in your own keystore before publishing to the Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
            systemProperty 'screens.out', rootProject.file('screenshots').absolutePath
        }
    }
}

dependencies {
    // QR codes for Google sign-in and the photo picker (pure Java, ~60 KB after shrinking)
    implementation 'com.google.zxing:core:3.5.3'

    // Only used by the screenshot test (renders every screen to PNG on your PC, no TV needed)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    // No AndroidX / Compose on purpose: plain Views + Canvas keep the APK tiny
    // and run smoothly on low-end Android TV chips (Mi TV, Fire-class SoCs).
}
