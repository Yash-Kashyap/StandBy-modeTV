plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yash.standbytv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yash.standbytv'
        minSdk 26          // Android TV 8.0 Oreo and newer
        targetSdk 34
        versionCode 4
        versionName '1.3'

    }

    // Release signing: keystore.properties (kept OUT of git) points at your private keystore.
    // Google sign-in is tied to this key's SHA-1, so always sign releases with the same key.
    def ksFile = rootProject.file('keystore.properties')
    signingConfigs {
        release {
            if (ksFile.exists()) {
                def ks = new Properties()
                ksFile.withInputStream { ks.load(it) }
                storeFile file(ks.getProperty('storeFile'))
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Your own key if keystore.properties exists, otherwise the debug key.
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://maven-central.storage-download.googleapis.com/maven2'
            systemProperty 'screens.out', rootProject.file('screenshots').absolutePath
        }
    }
}

dependencies {
    // QR codes for Google sign-in and the photo picker (pure Java, ~60 KB after shrinking)
    implementation 'com.google.zxing:core:3.5.3'
    // Google sign-in with the account already on the TV (needed for Google Photos)
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // Only used by the screenshot test (renders every screen to PNG on your PC, no TV needed)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    // No AndroidX / Compose on purpose: plain Views + Canvas keep the APK tiny
    // and run smoothly on low-end Android TV chips (Mi TV, Fire-class SoCs).
}
